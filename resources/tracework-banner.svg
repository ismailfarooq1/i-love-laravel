<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Tracework</title>
  <desc id="desc">Your judgment. AI’s legwork. An approved goal branches into reviewable tasks.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#172236"/>
      <stop offset="1" stop-color="#303451"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#a896eb" stop-opacity=".2"/>
      <stop offset="1" stop-color="#a896eb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#b1b8d3" opacity=".12"/>
    </pattern>
  </defs>
  <rect width="1200" height="380" rx="20" fill="url(#background)"/>
  <rect width="1200" height="380" rx="20" fill="url(#dots)"/>
  <ellipse cx="920" cy="160" rx="350" ry="260" fill="url(#glow)"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="52" y="46" width="35" height="35" rx="10" fill="#b3a0ec"/>
