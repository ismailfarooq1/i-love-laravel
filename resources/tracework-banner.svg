    <text x="103" y="69" fill="#b6a8d8" font-size="11" font-weight="600" letter-spacing="3">HUMAN-CONTROLLED PLANNING</text>
    <text x="52" y="157" fill="#fff" font-size="66" font-weight="750" letter-spacing="-3">Trace<tspan fill="#baa7ef">work</tspan></text>
    <text x="55" y="207" fill="#e3dfef" font-size="23" font-weight="500">Your judgment. AI’s legwork.</text>
    <text x="55" y="243" fill="#a4aec4" font-size="15">From source documents to goals, branches, and tasks.</text>
    <text x="55" y="268" fill="#a4aec4" font-size="15">A clear proposal. An inspectable source. Your approval.</text>
    <rect x="55" y="311" width="155" height="26" rx="13" fill="#b3a0ec" fill-opacity=".12" stroke="#b3a0ec" stroke-opacity=".3"/>
    <circle cx="70" cy="324" r="3" fill="#bba7f1"/>
    <text x="81" y="328" fill="#cabaf0" font-size="10" font-weight="600" letter-spacing="1">LOCAL PROTOTYPE</text>
    <g fill="none" stroke="#9b92c3" stroke-width="2" opacity=".65">
      <path d="M914 133v31Q914 180 898 180H798Q782 180 782 196v16"/>
      <path d="M914 133v31Q914 180 930 180h100q16 0 16 16v16"/>
      <path d="M782 266v27M1046 266v27"/>
    </g>
    <rect x="817" y="63" width="194" height="70" rx="12" fill="#353b57" stroke="#a994e6"/>
    <path d="M832 83l5-5 5 5-5 5z" fill="none" stroke="#c5b5ee"/>
    <text x="850" y="86" fill="#b9afd4" font-size="9" font-weight="600" letter-spacing="1.5">TOP-LEVEL GOAL</text>
    <text x="833" y="108" fill="#f5f1ff" font-size="13" font-weight="600">Launch a support portal</text>
    <g fill="#2b354b" stroke="#636680">
      <rect x="687" y="212" width="190" height="54" rx="10"/>
      <rect x="951" y="212" width="190" height="54" rx="10"/>
    </g>
    <text x="703" y="234" fill="#e4e3ef" font-size="11" font-weight="600">Customer requests</text>
    <text x="703" y="253" fill="#91ceb9" font-size="9">✓ Parent approved</text>
    <text x="967" y="234" fill="#e4e3ef" font-size="11" font-weight="600">Staff resolution</text>
    <text x="967" y="253" fill="#dbbe8c" font-size="9">○ Human review</text>
    <g fill="#30374e" stroke="#666380">
      <rect x="702" y="293" width="160" height="35" rx="8"/>
      <rect x="966" y="293" width="160" height="35" rx="8"/>
    </g>
    <text x="719" y="315" fill="#bcb5d3" font-size="10">☑ Submission form</text>
    <text x="983" y="315" fill="#bcb5d3" font-size="10">☑ Reply workflow</text>
    <text x="914" y="358" text-anchor="middle" fill="#8e92ad" font-size="9" letter-spacing="1.8">APPROVAL ↓  ·  COMPLETION ↑</text>
